<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Meu Treino</h1>

    <div id="listaTreinos">
        
    </div>

    <div id="conteudoTreino">

    </div>

    <button id="btnMostrarFormularioTreino">
        + Novo Treino
    </button>

    <div id="formularioTreino" class="oculto">
        <h3>Novo Treino</h3>

        <label>Nome do Treino:</label>

        <input
            type="text"
            id="nomeTreino">
        
        <button id="btnSalvarTreino">
            Criar Treino
        </button>

        <button id="btnCancelarTreino">
            Cancelar
        </button>

    </div>

    <button id="btnMostrarFormulario">
        + Adicionar Exercício
    </button>


    <div id="historicoTreinos" class="oculto"></div>

    <button id="btnHistorico">
        Histórico
    </button>

    <button id="btnEstatisticas">
        Estatísticas
    </button>

    <button id="btnExportarBackup">
        Exportar Backup
    </button>

    <button id="btnImportarBackup">
        Importar Backup
    </button>

    <input
        type="file"
        id="inputImportarBackup"
        accept=".json"
        class="oculto">

    <div id="formularioExercicio" class="oculto">

        <h3>Novo Exercício</h3>

        <label>Nome:</label>
        <input type="text" id="nomeExercicio">

        <label>Séries:</label>
        <input type="number" id="seriesExercicio">

        <label>Repetições</label>
        <input type="text" id="repeticoesExercicio">

        <label>Carga Atual</label>
        <input type="text" id="cargaExercicio">

        <label>Descanso (segundos):</label>
        <input type="number" id="descansoExercicio">

        <label>GIF:</label>
        <input type="text" id="gifExercicio">

        <label>Vídeo:</label>
        <input type="text" id="videoExercicio">

        <button id="btnSalvarExercicio">
            Salvar Exercício
        </button>

        <button id="btnCancelarExercicio">
            Cancelar
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
