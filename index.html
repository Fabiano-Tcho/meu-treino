<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="btnHome">

    <img
        src="logo-treino-plus.png"
        alt="Treino+"
        id="logoApp">

</h1>

    <section class="secao-app">

        <h2>📋 Treinos</h2>

        <h3>🏋️ Musculação</h3>

        <div id="listaTreinos">

        </div>

        <button id="btnMostrarFormularioTreino">
            + Novo Treino
        </button>

        <div id="formularioTreino" class="oculto">
            <h3>Novo Treino</h3>

            <label>Nome do Treino:</label>

            <input
                type="text"
                id="nomeTreino">
            
            <button id="btnSalvarTreino">
                Criar Treino
            </button>

            <button id="btnCancelarTreino">
                Cancelar
            </button>

        </div>

        <button id="btnMostrarFormulario">
            + Adicionar Exercício
        </button>

        <div id="formularioExercicio" class="oculto">

            <h3>Novo Exercício</h3>

            <label>Nome:</label>
            <input type="text" id="nomeExercicio">

            <label>Séries:</label>
            <input type="number" id="seriesExercicio">

            <label>Repetições</label>
            <input type="text" id="repeticoesExercicio">

            <label>Carga Atual</label>
            <input type="text" id="cargaExercicio">

            <label>Descanso (segundos):</label>
            <input type="number" id="descansoExercicio">

            <label>GIF:</label>
            <input type="text" id="gifExercicio">

            <label>Vídeo:</label>
            <input type="text" id="videoExercicio">

            <button id="btnSalvarExercicio">
                Salvar Exercício
            </button>

            <button id="btnCancelarExercicio">
                Cancelar
            </button>

        </div>

        <h3>🏃 Cardio</h3>
        
        <button id="btnCaminhada">
            🚶 Caminhada
        </button>

        <button id="btnCorrida">
            🏃 Corrida
        </button>

        <button id="btnBicicleta">
            🚴 Bicicleta
        </button>

    </section>

    <div id="conteudoTreino">

    </div>

    <div id="historicoTreinos" class="oculto"></div>

    <section class="secao-app">
        <h2>📊 Dados</h2>

        <button id="btnHistorico" class="btn-navegacao">
            Histórico
        </button>

        <button id="btnEstatisticas" class="btn-navegacao">
            Estatísticas
        </button>

    </section>

    <section class="secao-app">
        <h2>🛠 Ferramentas</h2>

        <button id="btnExportarBackup">
            Exportar Backup
        </button>

        <button id="btnImportarBackup">
            Importar Backup
        </button>
    </section>

    <input
        type="file"
        id="inputImportarBackup"
        accept=".json"
        class="oculto">

    <script src="script.js"></script>
</body>
</html>
