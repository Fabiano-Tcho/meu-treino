<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Meu Treino</h1>

    <button id="btnTreinoA">Treino A</button>
    <button id="btnTreinoB">Treino B</button>
    <button id="btnTreinoC">Treino C</button>
    <button id="btnFinalizarTreino" onclick="finalizarTreino()">Finalizar Treino</button>

    <div id="conteudoTreino">

    </div>

    <button id="btnMostrarFormulario">
        + Adicionar Exercício
    </button>

    <div id="formularioExercicio" class="oculto">

        <h3>Novo Exercício</h3>

        <label>Nome:</label>
        <input type="text" id="nomeExercicio">

        <label>Séries:</label>
        <input type="number" id="seriesExercicio">

        <label>Repetições</label>
        <input type="text" id="repeticoesExercicio">

        <label>Carga Atual</label>
        <input type="text" id="cargaExercicio">

        <label>Descanso (segundos):</label>
        <input type="number" id="descansoExercicio">

        <label>GIF:</label>
        <input type="text" id="gifExercicio">

        <label>Vídeo:</label>
        <input type="text" id="videoExercicio">

        <button id="btnSalvarExercicio">
            Salvar Exercício
        </button>

        <button id="btnCancelarExercicio">
            Cancelar
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
